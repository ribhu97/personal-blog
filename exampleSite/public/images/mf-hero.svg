<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Georgia, 'Times New Roman', serif">
  <rect width="1200" height="630" fill="#10131F"/>
  <g stroke="#232838" stroke-width="0.75">
    <line x1="100" y1="140" x2="1100" y2="140"/><line x1="100" y1="240" x2="1100" y2="240"/>
    <line x1="100" y1="340" x2="1100" y2="340"/><line x1="100" y1="440" x2="1100" y2="440"/>
    <line x1="100" y1="540" x2="1100" y2="540"/>
  </g>
  <line x1="600" y1="90" x2="600" y2="580" stroke="#E63946" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="600" y="78" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#E63946" text-anchor="middle" letter-spacing="1">THRESHOLD</text>
  <text x="614" y="102" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#8B93A7">above ⇢ good</text>

  <!-- baseline: flat, ends right at the threshold -->
  <path d="M 110 420 C 320 430 480 405 640 400 C 800 395 960 410 1090 402" stroke="#F4F2EC" stroke-width="2.2" fill="none"/>
  <text x="1090" y="392" font-size="14" fill="#F4F2EC" text-anchor="end">baseline</text>
  <!-- above-good: climbs across the threshold -->
  <path d="M 110 540 C 300 530 400 470 520 420 C 630 375 720 310 820 250 C 900 205 1000 195 1090 188" stroke="#E63946" stroke-width="2.4" fill="none"/>
  <text x="1090" y="178" font-size="14" fill="#E63946" text-anchor="end">above-good</text>
  <!-- below-good: sinks across the threshold -->
  <path d="M 110 210 C 300 220 400 260 520 300 C 630 335 720 370 820 400 C 900 425 1000 440 1090 448" stroke="#9FB4C7" stroke-width="2.2" fill="none"/>
  <text x="1090" y="460" font-size="14" fill="#9FB4C7" text-anchor="end">below-good</text>

  <circle cx="110" cy="540" r="6" fill="#10131F" stroke="#E63946" stroke-width="2"/>
  <circle cx="1090" cy="188" r="7" fill="#E63946"/>
  <circle cx="110" cy="210" r="6" fill="#10131F" stroke="#9FB4C7" stroke-width="2"/>
  <circle cx="1090" cy="448" r="7" fill="#9FB4C7"/>
</svg>
