<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" font-family="Georgia, 'Times New Roman', serif">
  <!-- y = 250 - v*200 ; bars 44 wide -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#888888" text-anchor="end">
    <text x="24" y="254">0</text><text x="24" y="154">0.5</text><text x="24" y="54">1</text>
  </g>
  <g stroke="#E9ECEF" stroke-width="0.75">
    <line x1="32" y1="250" x2="596" y2="250"/><line x1="32" y1="150" x2="596" y2="150"/><line x1="32" y1="50" x2="596" y2="50"/>
  </g>

  <!-- panel 1: above-threshold favoured -->
  <text x="112" y="34" font-size="13.5" fill="#111111" text-anchor="middle">Above-threshold is good</text>
  <rect x="68" y="116.6" width="44" height="133.4" fill="#2F4858"/>
  <text x="90" y="108" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#555555" text-anchor="middle">2/3</text>
  <rect x="134" y="116.6" width="44" height="133.4" fill="#9AA3AD"/>
  <text x="156" y="108" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#555555" text-anchor="middle">2/3</text>
  <rect x="200" y="210" width="44" height="40" fill="#E63946"/>
  <text x="222" y="202" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#555555" text-anchor="middle">1/5</text>
  <g font-size="11" fill="#888888" text-anchor="middle">
    <text x="90" y="278">control</text><text x="156" y="278">free resample</text><text x="222" y="278">implant</text>
  </g>

  <!-- panel 2: below-threshold favoured -->
  <text x="380" y="34" font-size="13.5" fill="#111111" text-anchor="middle">Below-threshold is good</text>
  <rect x="336" y="150" width="44" height="100" fill="#2F4858"/>
  <text x="358" y="142" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#555555" text-anchor="middle">2/4</text>
  <rect x="402" y="250" width="44" height="0" fill="#E63946"/>
  <text x="424" y="142" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#555555" text-anchor="middle">0/3</text>
  <rect x="468" y="250" width="44" height="0" fill="#9AA3AD"/>
  <text x="490" y="142" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#555555" text-anchor="middle">0/3</text>
  <g font-size="11" fill="#888888" text-anchor="middle">
    <text x="358" y="278">control</text><text x="424" y="278">implant</text><text x="490" y="278">free resample</text>
  </g>

  <text x="32" y="312" font-size="10.5" fill="#888888">good-side rate = fraction of parsed continuations landing on the donation-favoured side. Qwen3.5-122B, one source rollout per condition, 3–5 valid answers per cell.</text>
</svg>
