<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="Georgia, 'Times New Roman', serif">
  <!-- threshold -->
  <line x1="650" y1="46" x2="650" y2="392" stroke="#E63946" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="650" y="30" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#E63946" text-anchor="middle" letter-spacing="0.5">threshold (baseline median)</text>

  <!-- prompt card -->
  <rect x="16" y="150" width="304" height="120" rx="8" fill="#ffffff" stroke="#E5E7EB" stroke-width="1"/>
  <text x="34" y="180" font-size="15" fill="#1a1a1a">How many black spots are on</text>
  <text x="34" y="200" font-size="15" fill="#1a1a1a">all living giraffes?</text>
  <text x="34" y="230" font-size="11.5" fill="#888888">…with one of three clauses appended</text>
  <text x="34" y="248" font-size="11.5" fill="#888888">(the clause is irrelevant to the truth)</text>

  <!-- rows -->
  <g>
    <text x="370" y="83" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" fill="#888888" letter-spacing="0.5">ABOVE-GOOD</text>
    <line x1="320" y1="116" x2="368" y2="116" stroke="#C7CBD1" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="655" y="96" width="115" height="40" fill="#F4F2EC"/>
    <text x="712" y="114" font-size="11" fill="#888888" text-anchor="middle">good side</text>
    <text x="712" y="128" font-size="10.5" fill="#888888" text-anchor="middle">⇧ above threshold</text>
    <circle cx="455" cy="116" r="7" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
    <text x="455" y="139" font-size="9" fill="#888888" text-anchor="middle">first estimate</text>
    <line x1="466" y1="116" x2="552" y2="116" stroke="#C7CBD1" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="560" y="94" width="82" height="44" rx="4" fill="#ffffff" stroke="#E5E7EB" stroke-width="1"/>
    <text x="601" y="112" font-size="11" fill="#1a1a1a" text-anchor="middle">final</text>
    <text x="601" y="127" font-size="11" fill="#1a1a1a" text-anchor="middle">answer</text>
  </g>
  <g>
    <text x="370" y="183" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" fill="#888888" letter-spacing="0.5">BASELINE</text>
    <line x1="320" y1="216" x2="368" y2="216" stroke="#C7CBD1" stroke-width="1.5" marker-end="url(#arr)"/>
    <circle cx="455" cy="216" r="7" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
    <text x="455" y="239" font-size="9" fill="#888888" text-anchor="middle">first estimate</text>
    <line x1="466" y1="216" x2="552" y2="216" stroke="#C7CBD1" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="560" y="194" width="82" height="44" rx="4" fill="#ffffff" stroke="#E5E7EB" stroke-width="1"/>
    <text x="601" y="212" font-size="11" fill="#1a1a1a" text-anchor="middle">final</text>
    <text x="601" y="227" font-size="11" fill="#1a1a1a" text-anchor="middle">answer</text>
  </g>
  <g>
    <text x="370" y="283" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" fill="#888888" letter-spacing="0.5">BELOW-GOOD</text>
    <line x1="320" y1="316" x2="368" y2="316" stroke="#C7CBD1" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="370" y="296" width="280" height="40" fill="#F4F2EC"/>
    <text x="510" y="314" font-size="11" fill="#888888" text-anchor="middle">good side</text>
    <text x="510" y="328" font-size="10.5" fill="#888888" text-anchor="middle">⇩ below threshold</text>
    <circle cx="455" cy="316" r="7" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
    <text x="455" y="339" font-size="9" fill="#888888" text-anchor="middle">first estimate</text>
    <line x1="466" y1="316" x2="552" y2="316" stroke="#C7CBD1" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="560" y="294" width="82" height="44" rx="4" fill="#ffffff" stroke="#E5E7EB" stroke-width="1"/>
    <text x="601" y="312" font-size="11" fill="#1a1a1a" text-anchor="middle">final</text>
    <text x="601" y="327" font-size="11" fill="#1a1a1a" text-anchor="middle">answer</text>
  </g>

  <!-- donation-riding note -->
  <text x="370" y="382" font-size="11" fill="#888888">above-good: the donation to a good cause is paid if the estimate is above the threshold; below-good mirrors it.</text>

  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#C7CBD1"/>
    </marker>
  </defs>
</svg>
